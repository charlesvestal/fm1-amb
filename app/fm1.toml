# AMB-1's build settings (fm1-base's tools/build.py: ./build.sh)
name = "AMB"                   # the build's files: amb.fwsc, amb-X.Y.fwsc
id_prefix = "FM-1_7"           # package identity: dev FM-1_700, releases FM-1_7XXYYZZ (as AMB-1 0.9)
usb_manufacturer = "AMB-1"
usb_product = "AMB-1 FM-1"
ble = false                    # AMB-1 never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
# the site
tagline = "A generative ambient machine for the FM-1"
repo = "https://github.com/charlesvestal/fm1-amb"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "Charles Vestal"
description = "AMB-1 turns the M-VAVE FM-1 into a generative ambient machine, inspired by Brian Eno's Music for Airports. It plays itself from the moment it's switched on: breathing voices, soft bells on tape loops of unequal length, a gliding bass and quiet Euclidean percussion, through a tape echo and a plate reverb. It has eight pieces, and it is an album as much as an instrument. You don't perform it, you tend it: pick a piece and a scale, take notes out, put them back, and let it grow."
tags = ["ambient", "generative", "fm"]
install = "https://charlesvestal.github.io/fm1-amb/install/"
site = "https://charlesvestal.github.io/fm1-amb/"
screenshot = "docs/img/screen-garden.png"
