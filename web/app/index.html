<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6eeb5">
<title>AMB-1 · A generative ambient garden</title>
<meta name="description" content="AMB-1: a generative ambient garden.">
<style>
/* the colours of Ambient 1: Music for Airports (1978): the map's paper, its greens, its rivers, the ink */
:root {
  --paper: #f6eeb5; --green-1: #d0dc92; --green-2: #c2ce7f; --green-3: #9cb16f;
  --river: #85c3c1; --river-2: #549995; --ink: #1d1b02;
  color-scheme: light;
}
body { background: var(--paper); color: var(--ink); margin: 0; padding-inline: 16px; padding-block: 12px 40px;
       font: 15px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; }
#page { max-width: 980px; margin: 0 auto; }
h1 { font-weight: 300; font-size: 26px; letter-spacing: .02em; margin: 6px 0 2px; text-transform: uppercase; }
h1 small { font-size: 15px; }
#sub { text-transform: uppercase; margin: 0 0 10px; }
hr { border: 0; border-top: 1px solid var(--ink); margin: 10px 0; }
a { color: var(--ink); }
button, select, input { font: inherit; color: var(--ink); }
button { background: var(--green-1); border: 1px solid var(--ink); padding: 2px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--river); }
select { background: #fffbe0; border: 1px solid var(--ink); padding: 1px 2px; }
input[type="range"] { accent-color: var(--river-2); width: 100%; margin: 0; }
input[type="checkbox"] { accent-color: var(--river-2); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 8px 0; }
#wrap { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
#left { flex: 1 1 360px; max-width: 540px; }
#right { flex: 1 1 340px; }
/* the pieces as an album's tracks, listed beside the garden display */
#stage { display: flex; gap: 14px; align-items: flex-start; }
#tracks { flex: 0 0 auto; }
#tracks .cap { text-transform: uppercase; letter-spacing: .06em; font-size: 13px; margin: 0 0 4px; }
#tracks button { display: flex; align-items: baseline; gap: .6em; width: 100%; white-space: nowrap;
  background: none; border: 0; border-bottom: 1px solid var(--green-3); padding: 5px 4px; margin: 0; text-align: left; }
#tracks button:first-of-type { border-top: 1px solid var(--green-3); }
#tracks .num { color: var(--river-2); font-variant-numeric: tabular-nums; min-width: 1.1em; }
#tracks button:hover { background: var(--green-1); }
#tracks button[aria-current="true"] { background: var(--river); }
#tracks button[aria-current="true"] .num { color: var(--ink); }
#display { flex: 1 1 0; min-width: 0; }
canvas { display: block; width: 100%; aspect-ratio: 1 / 1.1; cursor: pointer; touch-action: manipulation; }
#msg { min-height: 1.4em; margin: 2px 0; }
fieldset { border: 1px solid var(--ink); margin: 0 0 10px; padding: 4px 10px 8px; }
legend { text-transform: uppercase; padding: 0 4px; }
table { width: 100%; border-collapse: collapse; }
td { padding: 3px 0; vertical-align: middle; }
td.n { width: 6.5em; }
td.v { width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; }
#scale button { width: 2.6em; padding: 2px 0; margin: 1px; background: #fffbe0; }
#scale button[aria-pressed="true"] { background: var(--green-3); }
#scale button.root { outline: 2px solid var(--river-2); outline-offset: -3px; }
#go { font-size: 17px; padding: 4px 18px; background: var(--river); }
#foot { margin-top: 16px; font-size: 13px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#scale button.root:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div id="page">
<main>
<h1>AMB-1</h1>
<p id="sub">A generative ambient garden</p>
<hr>

<div class="bar">
  <span id="keyLine"></span>
</div>
<div class="bar">
  <button id="go">Begin</button>
  <button id="play" hidden>Rest</button>
  <button id="freeze" aria-pressed="false">Freeze</button>
  <button id="next">Next chord</button>
  <label for="colour">Pad</label> <select id="colour"><option value="0">Rhodes</option><option value="1">Voices</option></select>
  <span role="group" aria-labelledby="octName">
    <span id="octName">Bells octave</span> <button id="octDn" aria-label="Bells an octave down">&minus;</button>
    <span id="octVal">0</span> <button id="octUp" aria-label="Bells an octave up">+</button></span>
</div>

<div id="wrap">
  <div id="left">
    <div id="stage">
      <nav id="tracks" aria-label="Pieces"><p class="cap" aria-hidden="true">Pieces</p></nav>
      <div id="display">
        <canvas id="ring" role="img" aria-label="The garden: the scale as a ring of twelve notes, the bell loops around it, the pulse below."></canvas>
        <p id="msg" role="status"></p>
      </div>
    </div>
  </div>
  <div id="right"></div>
</div>

<!-- what changes by itself (the chord, the piece, growing or resting), for a screen reader: polite, a few words -->
<div id="announce" class="sr" aria-live="polite" aria-atomic="true"></div>
</main>
<hr>
<footer id="foot">Click a note on the ring, or its button under Key, to add it to the scale or take it out. Each piece keeps its settings in this browser.
  <button id="reset">Reset this piece</button> <label><input type="checkbox" id="awake"> Keep screen on</label><br>
  After Brian Eno, <i>Ambient 1: Music for Airports</i> (1978). The same engine runs on the M-VAVE FM-1.</footer>
</div>

<script>
"use strict";
// ------------------------------------------------------------------ the engine's names (amb.h)
const P = { PAD: 0, BELLS: 1, BASS: 2, PULSE: 3, DENSITY: 4, EVOLVE: 5, DRIFT: 6, HITS: 7, ECHO: 8, ETIME: 9, REVERB: 10, SIZE: 11,
            BRIGHT: 12, SWELL: 13, BTONE: 14, MOTION: 15, TUNE: 16, MIDI: 17, TEMPO: 18, ROOT: 19, MODE: 20, BOCT: 21, PADTONE: 22,
            BASSOCT: 23, GLIDE: 24, FIFTH: 25, SWING: 26, HATS: 27 };
const NLOOP = 4, LOOP_MAX = 29;
const STORE = "eno-app-1";
// the layers, as the FM-1's pages: [parameter, its name there]
const GROUPS = [
  ["Garden", [[P.EVOLVE, "Evolve"], [P.MOTION, "Motion"], [P.DRIFT, "Drift"]]],
  ["Pad", [[P.PAD, "Level"], [P.SWELL, "Swell"], [P.BRIGHT, "Bright"]]],
  ["Bells", [[P.BELLS, "Level"], [P.DENSITY, "Density"], [P.BTONE, "Tone"]]],
  ["Bass", [[P.BASS, "Level"], [P.BASSOCT, "Octave"], [P.GLIDE, "Glide"], [P.FIFTH, "Fifth"]]],
  ["Pulse", [[P.PULSE, "Level"], [P.HITS, "Hits"], [P.SWING, "Swing"], [P.HATS, "Hats"]]],
  ["Space", [[P.ECHO, "Echo"], [P.ETIME, "Echo time"], [P.REVERB, "Reverb"], [P.SIZE, "Size"]]],
];
const TIP = { [P.DENSITY]: "notes per bell loop", [P.EVOLVE]: "how often things change and rest", [P.DRIFT]: "how long a chord lasts",
              [P.HITS]: "pulse hits", [P.ECHO]: "tape echo send", [P.ETIME]: "tape loop length", [P.REVERB]: "plate send",
              [P.SIZE]: "plate decay, echo feedback", [P.BRIGHT]: "pad filter", [P.SWELL]: "breath length",
              [P.BTONE]: "round to metallic", [P.MOTION]: "how far it drifts and swells", [P.BASSOCT]: "the bass an octave down or up",
              [P.GLIDE]: "how slowly the bass slides to its note", [P.FIFTH]: "how often the bass leans on the fifth",
              [P.SWING]: "the off sixteenths late", [P.HATS]: "dark and long to bright and crisp" };
const $ = (id) => document.getElementById(id);
// names in words, as the FM-1's screen reader says them (ui.c CHORD_Q, firmware/words.tsv)
const SPOKEN_NOTE = { "C#": "C sharp", "Eb": "E flat", "F#": "F sharp", "Ab": "A flat", "Bb": "B flat" };
const CHORD_Q = { "": "major", m: "minor", 7: "7", M7: "major 7", m7: "minor 7", 6: "6", m6: "minor 6", add9: "add 9",
                  madd9: "minor add 9", aug: "augmented", dim: "diminished", dim7: "diminished 7", m7b5: "half diminished",
                  mM7: "minor major 7", sus2: "suspended 2", sus4: "suspended 4", "7sus4": "7 suspended 4", 5: "5" };
const MODE_WORDS = { "Mixolyd.": "Mixolydian", "Pent maj": "pentatonic major", "Pent min": "pentatonic minor" };
const sayNote = (n) => SPOKEN_NOTE[n] || n;
function sayChord(name) {
  const m = /^([A-G][#b]?)(.*)$/.exec(name);
  return m ? `${sayNote(m[1])} ${CHORD_Q[m[2]] ?? m[2]}` : name;
}
// the polite live region: the newest news replaces what has not been read yet; the same words twice in a row
// are not read again by some screen readers, so the text alternates with a trailing space
let flip = false;
function announce(text) {
  flip = !flip;
  $("announce").textContent = text + (flip ? "" : " ");
}

// ------------------------------------------------------------------ the page's engine (pure questions)
let W = null, wasmBytes = null;
function cstr(ptr) {
  const m = new Uint8Array(W.memory.buffer);
  let e = ptr;
  while (m[e]) e++;
  return new TextDecoder().decode(m.subarray(ptr, e));
}
async function loadWasm() {
  if (typeof AMB_WASM !== "undefined") wasmBytes = Uint8Array.from(atob(AMB_WASM), (c) => c.charCodeAt(0)).buffer;
  else wasmBytes = await (await fetch("amb.wasm")).arrayBuffer();
  const stub = new Proxy({}, { get: () => () => 0 });
  const { instance } = await WebAssembly.instantiate(wasmBytes.slice(0), { env: stub, wasi_snapshot_preview1: stub });
  W = instance.exports;
  if (W._initialize) W._initialize();
}
const pname = (p) => cstr(W.app_param_name(p));
const ptext = (p, v) => cstr(W.app_param_text(p, v));
const plo = (p) => W.app_param_lo(p), phi = (p) => W.app_param_hi(p);
const note = (n) => cstr(W.app_note_name(n));
const pieceName = (i) => cstr(W.app_piece_name(i));

// ------------------------------------------------------------------ what is kept (per piece)
let S = null;            // { piece, slots: [{par, pool}], tune, gain, awake }
function recipe(i) {
  return { par: Array.from({ length: W.app_nparams() }, (_, p) => W.app_piece_par(i, p)), pool: W.app_piece_pool(i) };
}
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if (s && s.slots && s.slots.length === W.app_npieces() && s.slots.every((x) => x.par.length <= W.app_nparams())) {
      s.slots.forEach((x, i) => {      // kept before the bass and the pulse had their own settings: those from the recipe
        const r = recipe(i).par;
        while (x.par.length < r.length) x.par.push(r[x.par.length]);
      });
      return s;
    }
  } catch { /* none, or unreadable: the recipes */ }
  return { piece: 0, slots: Array.from({ length: W.app_npieces() }, (_, i) => recipe(i)), tune: 0, gain: 2400, awake: false };
}
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch { /* this session only */ } }, 300);
}
const cur = () => S.slots[S.piece];
const par = (p) => (p === P.TUNE ? S.tune : cur().par[p]);

// ------------------------------------------------------------------ the audio
let ac = null, node = null, queue = [], ready = false, playing = true, frozen = false;
function send(m) { if (ready) node.port.postMessage(m); else queue.push(m); }
function sendAll() {
  for (let p = 0; p < W.app_nparams(); p++) send({ t: "set", p, v: par(p) });
  send({ t: "set", p: P.MIDI, v: 0 });
  send({ t: "pool", v: cur().pool });
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
async function begin() {
  const go = $("go");
  go.disabled = true;
  go.textContent = "Starting...";
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100, latencyHint: "playback" });
    await ac.audioWorklet.addModule("worklet.js");
    node = new AudioWorkletNode(ac, "amb-app", { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
    // iPhone: straight to the speakers, with the audio session set to "playback" and a silent media element
    // looping beside it, so the page keeps playing with the screen locked. Through a MediaStream into a media
    // element (as before) it crackled once locked, when iOS hands audio over in larger blocks than that
    // path's buffer holds. ?stream goes the old way, ?direct leaves out the silent element (to compare).
    const opt = (k) => new RegExp("[?&]" + k + "\\b").test(location.search);
    let routed = false;
    if (isIOS && opt("stream") && ac.createMediaStreamDestination) {
      try {
        const dest = ac.createMediaStreamDestination(), el = new Audio();
        node.connect(dest);
        el.srcObject = dest.stream;
        el.setAttribute("playsinline", "");
        await el.play();
        routed = true;
      } catch { routed = false; }
    }
    if (!routed) node.connect(ac.destination);
    if (isIOS && !routed) {
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch { /* older iOS */ }
      if (!opt("direct")) keepAlive();
    }
    const readyP = new Promise((res) => {
      node.port.onmessage = (e) => {
        const m = e.data;
        if (m.t === "ready") res();
        else if (m.t === "state") { state = m.st; drumPat = m.pat; moving = true; watch(); }
      };
    });
    queue = [{ t: "seed", v: (Date.now() & 0xffff) }];
    sendAll();
    queue.push({ t: "gain", v: S.gain }, { t: "regrow" }, { t: "play", v: 1 });
    node.port.postMessage({ t: "load", wasm: wasmBytes.slice(0), queue });
    queue = [];
    await readyP;
    ready = true;
    await ac.resume();
    go.hidden = true;
    $("play").hidden = false;
    setPlaying(true);
    if (document.activeElement === document.body || document.activeElement === go) $("play").focus();   // Begin is gone: its place
    heard.piece = `${pieceName(S.piece)}, ${spokenKey()}. Growing`;
    hear();
    mediaSession();
    if (S.awake) wake(true);
    if (Math.abs(ac.sampleRate - 44100) > 1) msg(`Audio at ${ac.sampleRate} Hz: the pitch will be off.`);
  } catch (err) {
    go.disabled = false;
    go.textContent = "Begin";
    msg("No sound: " + (err && err.message || err));
  }
}
// A second of silence, looping: a media element playing keeps the page's audio going with the screen locked
// and puts AMB-1 on the lock screen (Play / Rest through the media session).
let silent = null;
function keepAlive() {
  const n = 8000, b = new ArrayBuffer(44 + 2 * n), v = new DataView(b);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + 2 * n, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 16000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, 2 * n, true);
  silent = new Audio(URL.createObjectURL(new Blob([b], { type: "audio/wav" })));
  silent.loop = true;
  silent.setAttribute("playsinline", "");
  silent.play().catch(() => { /* refused: plays only while the page is on screen */ });
}
// what is announced: the piece (on a change), growing or resting, frozen or not, and the chord each time the garden
// moves on. Gathered for a moment and said together, so a new piece (and the chord it grows) is one message;
// a chord is said at most every 4 s, and only once the garden has begun.
const heard = { piece: "", news: [], chord: "", saidChord: "" };
let hearT = 0, chordT = 0, chordAt = 0;
function hear() {
  clearTimeout(hearT);
  hearT = setTimeout(() => {
    const parts = [heard.piece, ...heard.news.slice(-3)];
    if (heard.chord && heard.chord !== heard.saidChord) { parts.push(heard.chord); heard.saidChord = heard.chord; chordAt = performance.now(); }
    const text = parts.filter(Boolean).join(". ");
    heard.piece = "";
    heard.news = [];
    if (text) announce(text);
  }, 900);
}
function tell(news) {                                       // what a button did, said with whatever else is new
  heard.news = heard.news.filter((n) => n !== news).concat(news);
  hear();
}
function watch() {
  if (!state || !ready) return;
  const name = cstr(W.app_chord_name(state[2], state[4], state[5], state[6], state[7]));
  const words = sayChord(name);
  if (words === heard.chord) return;
  heard.chord = words;
  $("ring").setAttribute("aria-label", `The garden: the chord ${words}, in ${spokenKey()}. The scale as a ring of twelve notes, the bell loops around it, the pulse below.`);
  clearTimeout(chordT);                                     // at most a chord every 4 s
  chordT = setTimeout(hear, Math.max(0, 4000 - (performance.now() - chordAt)));
}
function setPlaying(on) {
  if (ready && on !== playing) { tell(on ? "Growing" : "Resting"); }
  playing = on;
  send({ t: "play", v: on ? 1 : 0 });
  $("play").textContent = on ? "Rest" : "Play";
  if (navigator.mediaSession) navigator.mediaSession.playbackState = on ? "playing" : "paused";
}
function mediaSession() {
  if (!navigator.mediaSession || !window.MediaMetadata) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: pieceName(S.piece), artist: "AMB-1" });
  try {
    navigator.mediaSession.setActionHandler("play", () => setPlaying(true));
    navigator.mediaSession.setActionHandler("pause", () => setPlaying(false));
  } catch { /* not every action exists everywhere */ }
}
let lock = null;
async function wake(on) {
  try {
    if (on && navigator.wakeLock) lock = await navigator.wakeLock.request("screen");
    else if (lock) { await lock.release(); lock = null; }
  } catch { /* refused: the screen sleeps as usual */ }
}
document.addEventListener("visibilitychange", () => {
  send({ t: "vis", v: document.visibilityState === "visible" });   // hidden: the worklet stops sending the state
  if (document.visibilityState === "visible") {
    if (S && S.awake && !lock) wake(true);
    if (ac && ac.state !== "running" && playing) ac.resume();
    if (silent && silent.paused) silent.play().catch(() => {});   // after a call or another app's audio
  }
});

// ------------------------------------------------------------------ changes
function setPar(p, v) {
  v = Math.max(plo(p), Math.min(phi(p), v | 0));
  if (p === P.TUNE) S.tune = v; else cur().par[p] = v;
  send({ t: "set", p, v });
  save();
}
function setPool(pool) { cur().pool = pool; send({ t: "pool", v: pool }); save(); }
function poolAbs() { const p = cur().pool, r = par(P.ROOT); return ((p << r) | (p >> (12 - r))) & 0xfff; }
function modeName() {
  const m = par(P.MODE);
  return cur().pool === W.app_mode_pool(m) ? ptext(P.MODE, m) : "Custom";
}
let msgT = 0;
function msg(s) {
  $("msg").textContent = s;
  clearTimeout(msgT);
  msgT = setTimeout(() => { $("msg").textContent = ""; }, 3000);
}
function toggleNote(pc) {
  const rel = (pc - par(P.ROOT) + 12) % 12, p = cur().pool ^ (1 << rel);
  if (rel === 0) return msg(`${note(pc)} is the root.`);
  let n = 0;
  for (let i = 0; i < 12; i++) n += (p >> i) & 1;
  if (n < 3) return msg("Three notes at least.");
  const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest("#scale") ? pc : -1;
  setPool(p);
  refresh();
  if (focused >= 0) $("scale").children[focused].focus();   // the table is rebuilt: the focus stays on the note
}
function choosePiece(i) {
  if (i !== S.piece) {
    S.piece = i;
    sendAll();
    send({ t: "seed", v: (Date.now() & 0xffff) });
    send({ t: "regrow" });
    save();
  }
  mediaSession();
  refresh();
  heard.piece = `${pieceName(S.piece)}, ${spokenKey()}`;   // said with the chord it grows, once it has settled
  hear();
}
function resetPiece() {
  const r = recipe(S.piece);
  S.slots[S.piece] = r;
  sendAll();
  send({ t: "regrow" });
  save();
  refresh();
}

// ------------------------------------------------------------------ the controls: plain tables in fieldsets
function rangeRow(p, label) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="n"><label for="p${p}">${label || pname(p)}</label></td><td><input type="range" id="p${p}" min="${plo(p)}" max="${phi(p)}" step="1"></td><td class="v" id="p${p}-v"></td>`;
  const input = tr.querySelector("input"), out = tr.querySelector(".v");
  if (TIP[p]) { tr.title = TIP[p]; input.setAttribute("aria-description", TIP[p]); }
  out.setAttribute("aria-hidden", "true");                  // the slider says its own value
  input.value = par(p);
  out.textContent = ptext(p, par(p));
  input.setAttribute("aria-valuetext", ptext(p, par(p)));
  input.oninput = () => {
    setPar(p, +input.value);
    out.textContent = ptext(p, par(p));
    input.setAttribute("aria-valuetext", ptext(p, par(p)));
    if (p === P.TEMPO) $("keyLine").textContent = keyLine();
  };
  return tr;
}
function build() {
  const right = $("right");
  right.innerHTML = "";
  for (const [name, ps] of GROUPS) {
    const fs = document.createElement("fieldset"), t = document.createElement("table");
    fs.innerHTML = `<legend>${name}</legend>`;
    ps.forEach(([p, label]) => t.appendChild(rangeRow(p, label)));
    fs.appendChild(t);
    right.appendChild(fs);
  }
  // the key: root, mode, the scale's notes, tempo, tune, volume
  const fs = document.createElement("fieldset"), t = document.createElement("table");
  fs.innerHTML = `<legend>Key</legend>`;
  const sel = (label, id, opts, value, on) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="n"><label for="${id}">${label}</label></td><td colspan="2"><select id="${id}"></select></td>`;
    const s = tr.querySelector("select");
    opts.forEach((o, i) => { const e = document.createElement("option"); e.value = i; e.textContent = o; s.appendChild(e); });
    s.value = value;
    s.onchange = () => on(+s.value);
    t.appendChild(tr);
  };
  sel("Root", "root", Array.from({ length: 12 }, (_, i) => note(i)), par(P.ROOT), (v) => { setPar(P.ROOT, v); refresh(); });
  const modes = Array.from({ length: W.app_nmodes() }, (_, m) => ptext(P.MODE, m));
  sel("Mode", "mode", modeName() === "Custom" ? modes.map((m, i) => (i === par(P.MODE) ? m + " (changed)" : m)) : modes, par(P.MODE),
      (m) => { setPar(P.MODE, m); setPool(W.app_mode_pool(m)); refresh(); });
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="n" id="scaleName">Scale</td><td colspan="2" id="scale" role="group" aria-labelledby="scaleName"></td>`;
  const ap = poolAbs();
  for (let i = 0; i < 12; i++) {
    const b = document.createElement("button");
    b.textContent = note(i);
    b.setAttribute("aria-pressed", (ap >> i) & 1 ? "true" : "false");
    // the name keeps the text shown (for voice control), and says a flat as a flat
    if (sayNote(note(i)) !== note(i)) b.setAttribute("aria-label", `${note(i)} (${sayNote(note(i))})`);
    if (i === par(P.ROOT)) { b.className = "root"; b.title = "The root"; b.setAttribute("aria-description", "The root: it stays in the scale."); }
    b.onclick = () => toggleNote(i);
    tr.lastChild.appendChild(b);
  }
  t.appendChild(tr);
  t.appendChild(rangeRow(P.TEMPO));
  t.appendChild(rangeRow(P.TUNE));
  const vr = document.createElement("tr");
  vr.innerHTML = `<td class="n"><label for="vol">Volume</label></td><td><input type="range" id="vol" min="0" max="4096" step="16"></td><td class="v"></td>`;
  const vol = vr.querySelector("input"), vout = vr.querySelector(".v");
  const volText = () => { const t = Math.round(100 * S.gain / 4096) + "%"; vout.textContent = t; vol.setAttribute("aria-valuetext", t); };
  vout.setAttribute("aria-hidden", "true");
  vol.value = S.gain;
  volText();
  vol.oninput = () => { S.gain = +vol.value; send({ t: "gain", v: S.gain }); volText(); save(); };
  t.appendChild(vr);
  fs.appendChild(t);
  right.appendChild(fs);
}
const keyLine = () => `${note(par(P.ROOT))} ${modeName()}, ${par(P.TEMPO)} bpm`;
const spokenKey = () => `${sayNote(note(par(P.ROOT)))} ${MODE_WORDS[modeName()] || modeName()}, ${par(P.TEMPO)} beats a minute`;
function buildTracks() {
  const el = $("tracks");
  if (!el.querySelector("button"))
    for (let i = 0; i < W.app_npieces(); i++) {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<span class="num" aria-hidden="true">${i + 1}</span><span class="ttl">${pieceName(i)}</span>`;
      b.setAttribute("aria-label", `${i + 1}. ${pieceName(i)}`);
      b.onclick = () => choosePiece(i);
      el.appendChild(b);
    }
  el.querySelectorAll("button").forEach((b, i) => {
    if (i === S.piece) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  });
}
function refresh() {
  buildTracks();
  $("keyLine").textContent = keyLine();
  $("colour").value = par(P.PADTONE);
  $("octVal").textContent = ptext(P.BOCT, par(P.BOCT));
  $("reset").textContent = `Reset ${pieceName(S.piece)}`;
  delete $("reset").dataset.armed;
  build();
  dirty = true;
}

// ------------------------------------------------------------------ the ring, in the cover's colours
let state = null, drumPat = [0, 0, 0], dirty = true;
const cv = $("ring"), g = cv.getContext("2d");
const C = { paper: "#f6eeb5", g1: "#d0dc92", g2: "#c2ce7f", g3: "#9cb16f", river: "#85c3c1", river2: "#549995", ink: "#1d1b02" };
const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';
let geom = null;
function size() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * d);
  cv.height = Math.round(r.height * d);
  geom = { d, w: cv.width, h: cv.height, cx: cv.width / 2, cy: cv.width / 2, R: cv.width * 0.47 };
  dirty = true;
}
const at = (r, i, n) => { const a = (i / n) * Math.PI * 2; return [geom.cx + Math.sin(a) * r, geom.cy - Math.cos(a) * r]; };
function disc(x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ring(x, y, r, c, lw) { g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); }
function draw() {
  if (!geom || !W) return;
  const { cx, cy, R, w, h, d } = geom, st = state;
  g.clearRect(0, 0, w, h);
  const on = st ? st[0] > 0 : false, fr = st ? st[1] > 0 : false;
  // the way to the next chord: a river round the outside
  ring(cx, cy, R * 0.985, C.g1, 2 * d);
  if (st && !fr && st[12] > 0) {
    g.strokeStyle = C.river2; g.lineWidth = 2 * d;
    g.beginPath(); g.arc(cx, cy, R * 0.985, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * st[12]); g.stroke();
  }
  if (fr) ring(cx, cy, R * 0.94, C.river, 3 * d);
  // the four bell loops: steps, notes, playheads
  const LR = [0.56, 0.665, 0.77, 0.875];
  for (let l = 0; l < NLOOP; l++) {
    const len = W.app_loop_len(l), r = R * LR[l], pos = st ? st[17 + l] : -1, glow = st ? st[21 + l] : 0;
    for (let s = 0; s < len; s++) {
      const [x, y] = at(r, s, len), has = st ? st[32 + l * LOOP_MAX + s] >= 0 : false;
      if (has) disc(x, y, R * 0.02, s === pos && on && glow > 0.2 ? C.river2 : C.river);
      else disc(x, y, R * 0.006, C.g3);
    }
    if (on && pos >= 0) { const [x, y] = at(r, pos, len); ring(x, y, R * 0.03, C.ink, 1 * d); }
  }
  // the scale: twelve notes, C at the top; in the scale green, the chord deep green, the root circled
  const ap = poolAbs(), root = par(P.ROOT);
  let chord = 0;
  if (st) for (let i = 0; i < 4; i++) chord |= 1 << (st[4 + i] % 12);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = `${Math.round(R * 0.05)}px ${FONT}`;
  for (let i = 0; i < 12; i++) {
    const [x, y] = at(R * 0.38, i, 12), inS = (ap >> i) & 1, ch = (chord >> i) & 1, rr = R * 0.062;
    if (inS) disc(x, y, rr, ch ? C.g3 : C.g2);
    if (i === root) ring(x, y, rr + 3 * d, C.ink, 1 * d);
    else if (!inS) ring(x, y, rr * 0.8, C.g3, 1 * d);
    g.fillStyle = C.ink;
    g.fillText(note(i), x, y + 0.5 * d);
  }
  // the chord's name in the middle
  if (st) {
    g.fillStyle = C.ink;
    g.font = `300 ${Math.round(R * 0.13)}px ${FONT}`;
    g.fillText(cstr(W.app_chord_name(st[2], st[4], st[5], st[6], st[7])), cx, cy);
  }
  // below: the three pulse rings
  const by = w + (h - w) * 0.45, pr = Math.min(R * 0.1, (h - w) * 0.36);
  for (let k = 0; k < 3; k++) {
    const n = W.app_drum_n(k), x0 = w / 2 + (k - 1) * pr * 2.8, pos = st ? st[25 + k] : -1, rest = st && st[31] > 0;
    for (let s = 0; s < n; s++) {
      const a = (s / n) * Math.PI * 2, x = x0 + Math.sin(a) * pr, y = by - Math.cos(a) * pr, hit = (drumPat[k] >> s) & 1, now = on && s === pos;
      if (hit) disc(x, y, R * (now ? 0.022 : 0.015), rest ? C.g1 : now ? C.ink : C.g3);   /* resting: faded */
      else disc(x, y, R * (now ? 0.01 : 0.005), now ? C.ink : C.g3);
    }
  }
}
// the playheads move with the music; with reduced motion asked for, the ring is redrawn every 2 s instead
const calm = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
let moving = false, drawnAt = 0;
function tick(t) {
  if (dirty || (moving && (!calm.matches || t - drawnAt >= 2000))) { dirty = moving = false; drawnAt = t; draw(); }
  requestAnimationFrame(tick);
}
cv.addEventListener("click", (e) => {
  if (!geom) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * geom.d, y = (e.clientY - r.top) * geom.d;
  let best = -1, bd = geom.R * 0.13;
  for (let i = 0; i < 12; i++) {
    const [nx, ny] = at(geom.R * 0.38, i, 12), dist = Math.hypot(nx - x, ny - y);
    if (dist < bd) { bd = dist; best = i; }
  }
  if (best >= 0) toggleNote(best);
});

// ------------------------------------------------------------------ start
(async function main() {
  await loadWasm();
  S = loadStore();
  if (typeof S.gain !== "number") S.gain = 2400;
  refresh();
  size();
  new ResizeObserver(size).observe(cv);
  requestAnimationFrame(tick);
  $("go").onclick = begin;
  $("play").onclick = () => setPlaying(!playing);
  $("freeze").onclick = (e) => {
    if (!ready) return;
    frozen = !frozen;
    send({ t: "freeze", v: frozen ? 1 : 0 });
    e.currentTarget.setAttribute("aria-pressed", frozen ? "true" : "false");
    tell(frozen ? "Frozen: the chord holds, the reverb rings on" : "Thawed");
  };
  $("next").onclick = () => {
    send({ t: "next" });
    if (ready) tell(playing ? "Next chord, on the bar" : "Next chord");
  };
  $("colour").onchange = (e) => { setPar(P.PADTONE, +e.target.value); refresh(); };
  const oct = (d) => { setPar(P.BOCT, par(P.BOCT) + d); refresh(); msg(`Bells octave ${ptext(P.BOCT, par(P.BOCT))}`); };
  $("octDn").onclick = () => oct(-1);
  $("octUp").onclick = () => oct(1);
  $("awake").checked = !!S.awake;
  $("awake").onchange = (e) => { S.awake = e.target.checked; wake(S.awake); save(); };
  $("reset").onclick = (e) => {
    const b = e.currentTarget;
    if (b.dataset.armed) { resetPiece(); return; }
    b.dataset.armed = "1";
    b.textContent = "Click again to reset";
    msg(`Press again to put ${pieceName(S.piece)} back to its recipe.`);
  };
})();
</script>
</body>
</html>
